spring.application.name=parking-lot

## Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/parking_lot_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=welcome@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Hibernate Configuration (JPA)
# 'update' keeps data and updates the schema. Use 'create' to drop/re-create on every run.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

